<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ · ศูนย์งาน | Codera</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F2F2EF;--card:#fff;--ink:#111;--muted:#55554F;--line:#E6E6E1;--green:#9BD137;--on-green:#14200a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121210;--card:#1a1a17;--ink:#f3f3ee;--muted:#a3a39b;--line:#2c2c28}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;padding:24px 16px}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:40px 32px;text-align:center}
.logo{display:flex;gap:10px;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin-bottom:28px}
.logo img{width:32px;height:32px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 28px;text-wrap:pretty}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px;border-radius:12px;background:var(--ink);color:var(--card);font:inherit;font-weight:600;font-size:16px;text-decoration:none;transition:transform .2s cubic-bezier(.22,1,.36,1)}
.go:active{transform:scale(.98)}
.go:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.go svg{width:20px;height:20px;flex:none}
.note{margin:20px 0 0;font-size:13px}
</style>
</head>
<body>
<main class="box">
  <div class="logo"><img src="/favicon.svg" alt="">Codera Solutions</div>
  <h1>ศูนย์งาน</h1>
  <p>งาน แผน แบรนด์ คลังเทมเพลต และ LINE Studio ของทีม · เข้าได้เฉพาะบัญชี Google ที่ได้รับสิทธิ์</p>
  <a class="go" id="go" href="https://script.google.com/macros/s/AKfycbzMF4n-7b_D_pxHqtdjbPsuODFkTt38J_jbIiJYNlsKLN394TSAZegHCYoQBtYefnhh/exec"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h6c-.3 1.4-1.1 2.5-2.2 3.3v2.8h3.6c2.1-1.9 3.2-4.8 3.2-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.4-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.9C3.8 20.5 7.6 23 12 23z"/><path fill="#FBBC05" d="M5.7 14c-.2-.7-.4-1.4-.4-2s.1-1.4.4-2V7.1H2C1.4 8.6 1 10.2 1 12s.4 3.4 1 4.9L5.7 14z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.6 1 3.8 3.5 2 7.1L5.7 10c.9-2.7 3.4-4.6 6.3-4.6z"/></svg>เข้าสู่ระบบด้วย Google</a>
  <p class="note">ครั้งแรก Google จะถามสิทธิ์อ่าน-เขียนชีตและดูไฟล์ Drive ของบัญชีคุณ · ยังไม่มีสิทธิ์? ส่งอีเมล Gmail ให้คิม</p>
</main>
</body>
</html>
